services:
  build:
    image: eclipse-temurin:21-jdk-jammy
    working_dir: /workspace
    environment:
      GRADLE_USER_HOME: /gradle-cache
    volumes:
      - .:/workspace
      - ./.docker-gradle-cache:/gradle-cache
      # Shadows the project-local .gradle/ dir with an isolated copy so this
      # never contends for its lock files with a Gradle daemon on the host
      # (e.g. one invoking this via the dockerBuild/dockerGenerateOpenApiDocs
      # host tasks).
      - ./.docker-gradle-project-cache:/workspace/.gradle
    entrypoint: ["./gradlew"]
    command: ["build"]
