[versions]
kotlin = "2.3.21"
exposed = "1.3.1"
spring-boot = "4.1.1"
adoc-convert = "4.0.5"
spring-dm = "1.1.7"
springdoc = "3.1.0"
springdoc-gradle-plugin = "1.9.0"

[libraries]
kasechange = { group = "net.pearx.kasechange", name="kasechange", version = "1.4.1" }
exposed-spring = { group = "org.jetbrains.exposed", name="exposed-spring-boot4-starter", version.ref="exposed" }
exposed-java-time = { group = "org.jetbrains.exposed", name="exposed-java-time", version.ref="exposed" }
spring-cloud-bom = { group = "org.springframework.cloud", name="spring-cloud-dependencies", version="2025.1.2" }
springdoc-openapi-webmvc-ui = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dm" }
asciidoc = { id = "org.asciidoctor.jvm.convert", version.ref = "adoc-convert" }
springdoc-openapi-gradle = { id = "org.springdoc.openapi-gradle-plugin", version.ref = "springdoc-gradle-plugin" }
